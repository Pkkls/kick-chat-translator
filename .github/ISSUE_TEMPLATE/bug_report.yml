name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Brave, Edge, Firefox]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "e.g. 2.5.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect vs what actually happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open kick.com/...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Translation provider
      options: [Google (default), DeepL, MyMemory, Lingva, On-device]
