name: CI

on:
  push:
    branches: [master, main, v2-rewrite]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  build:
    name: build (chrome + firefox)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: extension-bundles
          path: |
            dist/
            release/
          retention-days: 14
