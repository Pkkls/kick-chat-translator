name: CI

on:
  push:
    branches: [master, main, v2-rewrite]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Store clients against fake stores
        run: node scripts/stores/cws-selftest.mjs && node scripts/stores/amo-selftest.mjs

  build:
    name: build (chrome + firefox)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build           # chromium → dist/
      - run: npm run pack            # → release/…-chromium.zip
      - run: npm run build:firefox   # rebuild dist/ as the Firefox bundle
      - run: npm run pack:firefox    # → release/…-firefox.zip
      # The store texts, checked on every change rather than on release day:
      # field limits and permissions, then dashes, accents and versions.
      - run: python3 test/audits/audit_fiche.py
      - run: node scripts/stores/payloads.mjs "$RUNNER_TEMP/stores"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-bundles
          path: |
            dist/
            release/
          retention-days: 14
