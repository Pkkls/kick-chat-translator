name: Release

# A tag vX.Y.Z is a release on both stores (see .claude/skills/publish-stores).
# Run by hand, the same job stops before anything is sent: a dry run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # preflight compares with the previous tag: it needs the tags and history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: The tag is the version in package.json
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm run release:check
      - name: Store clients against fake stores
        run: node scripts/stores/cws-selftest.mjs && node scripts/stores/amo-selftest.mjs

      # The AMO reviewer notes promise a byte-reproducible build: prove it here.
      - name: Build and pack twice, byte for byte
        run: |
          npm run package:all
          sha256sum release/*.zip > "$RUNNER_TEMP/first.sha"
          npm run package:all
          sha256sum -c "$RUNNER_TEMP/first.sha"

      - name: Source archive and store payloads
        run: |
          V=$(node -p "require('./package.json').version")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          git archive --format=zip --prefix="kick-chat-translator-$V/" -o "release/kick-chat-translator-$V-source.zip" HEAD
          node scripts/stores/payloads.mjs "$RUNNER_TEMP/stores"
          python3 test/audits/audit_fiche.py
          # What this release asks of a person in the Chrome dashboard, in the log
          # where a refusal would be read. It cannot tell whether it was done.
          node scripts/stores/preflight.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Store credentials
        if: github.event_name == 'push'
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          umask 077
          printf '%s' "$CWS_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/cws-key.json"
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/amo-api.json", JSON.stringify({ issuer: process.env.AMO_JWT_ISSUER, secret: process.env.AMO_JWT_SECRET }))'

      # Each store is its own step and neither stops the other. In 3.0.2 Chrome
      # refused the submission (a permission without its justification in the
      # dashboard), the job stopped there, and AMO and the GitHub release were
      # skipped and had to be sent by hand. The outcome step below turns the job
      # red again once everything that could go has gone.

      # A submission still in review blocks a new package: this release replaces it.
      - name: Chrome Web Store
        id: chrome
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          CWS_SA_KEY: ${{ runner.temp }}/cws-key.json
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          node scripts/stores/cws.mjs cancel || echo "no submission in review to cancel"
          node scripts/stores/cws.mjs upload "release/kick-chat-translator-$VERSION-chromium.zip" --publish

      - name: addons.mozilla.org
        id: amo
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          AMO_API_KEY: ${{ runner.temp }}/amo-api.json
        run: |
          node scripts/stores/amo.mjs release "release/kick-chat-translator-$VERSION-firefox.zip" "release/kick-chat-translator-$VERSION-source.zip" "$RUNNER_TEMP/stores/amo-notes.json"
          node scripts/stores/amo.mjs listing "$RUNNER_TEMP/stores/amo-listing.json"

      - name: Release notes with checksums
        run: |
          { cat store/notes/en.txt; echo; echo '```'; (cd release && sha256sum *.zip); echo '```'; } > "$RUNNER_TEMP/release-notes.md"

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          files: release/*.zip
          body_path: ${{ runner.temp }}/release-notes.md

      - name: Stores outcome
        if: github.event_name == 'push'
        env:
          CHROME: ${{ steps.chrome.outcome }}
          AMO: ${{ steps.amo.outcome }}
        run: |
          echo "Chrome Web Store: $CHROME"
          echo "addons.mozilla.org: $AMO"
          if [ "$CHROME" != success ]; then
            echo "::error title=Chrome Web Store::The package may be uploaded but not submitted. INVALID_ITEM_METADATA means the dashboard wants something no API can set (a permission justification, a privacy certification, a listing field). Fix it in the dashboard, then run: node scripts/stores/cws.mjs publish"
          fi
          if [ "$AMO" != success ]; then
            echo "::error title=addons.mozilla.org::Rerun by hand with the artifacts of this tag: node scripts/stores/amo.mjs release <firefox.zip> <source.zip> <amo-notes.json>"
          fi
          test "$CHROME" = success && test "$AMO" = success
