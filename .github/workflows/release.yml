name: Release

# A tag vX.Y.Z is a release on both stores (see .claude/skills/publish-stores).
# Run by hand, the same job stops before anything is sent: a dry run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: The tag is the version in package.json
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm run release:check
      - name: Store clients against fake stores
        run: node scripts/stores/cws-selftest.mjs && node scripts/stores/amo-selftest.mjs

      # The AMO reviewer notes promise a byte-reproducible build: prove it here.
      - name: Build and pack twice, byte for byte
        run: |
          npm run package:all
          sha256sum release/*.zip > "$RUNNER_TEMP/first.sha"
          npm run package:all
          sha256sum -c "$RUNNER_TEMP/first.sha"

      - name: Source archive and store payloads
        run: |
          V=$(node -p "require('./package.json').version")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          git archive --format=zip --prefix="kick-chat-translator-$V/" -o "release/kick-chat-translator-$V-source.zip" HEAD
          node scripts/stores/payloads.mjs "$RUNNER_TEMP/stores"
          python3 test/audits/audit_fiche.py

      - name: Store credentials
        if: github.event_name == 'push'
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          umask 077
          printf '%s' "$CWS_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/cws-key.json"
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/amo-api.json", JSON.stringify({ issuer: process.env.AMO_JWT_ISSUER, secret: process.env.AMO_JWT_SECRET }))'

      # A submission still in review blocks a new package: this release replaces it.
      - name: Chrome Web Store
        if: github.event_name == 'push'
        env:
          CWS_SA_KEY: ${{ runner.temp }}/cws-key.json
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          node scripts/stores/cws.mjs cancel || echo "no submission in review to cancel"
          node scripts/stores/cws.mjs upload "release/kick-chat-translator-$VERSION-chromium.zip" --publish

      - name: addons.mozilla.org
        if: github.event_name == 'push'
        env:
          AMO_API_KEY: ${{ runner.temp }}/amo-api.json
        run: |
          node scripts/stores/amo.mjs release "release/kick-chat-translator-$VERSION-firefox.zip" "release/kick-chat-translator-$VERSION-source.zip" "$RUNNER_TEMP/stores/amo-notes.json"
          node scripts/stores/amo.mjs listing "$RUNNER_TEMP/stores/amo-listing.json"

      - name: Release notes with checksums
        run: |
          { cat store/notes/en.txt; echo; echo '```'; (cd release && sha256sum *.zip); echo '```'; } > "$RUNNER_TEMP/release-notes.md"

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          files: release/*.zip
          body_path: ${{ runner.temp }}/release-notes.md
