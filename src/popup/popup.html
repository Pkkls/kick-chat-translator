<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kick Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="../../public/icons/icon48.png" alt="" width="24" height="24" onerror="this.style.display='none'">
    <span class="title">Kick Translator</span>
    <label class="toggle">
      <input type="checkbox" id="toggleEnabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="section">
    <label class="label">Display style</label>
    <select id="displayStyle">
      <option value="below">Below original</option>
      <option value="inline">Inline (after message)</option>
      <option value="replace">Replace text</option>
    </select>
  </div>

  <div class="section">
    <label class="checkbox-row">
      <input type="checkbox" id="showOriginal">
      <span>Show original text</span>
    </label>
  </div>

  <div class="section info">
    <span class="badge-row">
      <span class="badge">MyMemory</span> primary
      <span class="sep">→</span>
      <span class="badge">LibreTranslate</span> fallback
    </span>
    <p class="hint">Free, no API key required.</p>
  </div>

  <div class="footer">
    <span id="statusMsg" class="status"></span>
    <button id="saveBtn">Save</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
